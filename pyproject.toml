[project]
name = "ecoflow-stats"
version = "0.1.0"
description = "Self-hosted outage, energy and battery statistics for an EcoFlow power station."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "python-multipart",
    "anyio",
]

[project.scripts]
ecoflow-stats = "ecoflow_stats.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoflow_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
